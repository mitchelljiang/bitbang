<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bitbang</title>
    <meta name="description" content="In-depth, bit-level timing diagrams of communication protocols." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="bitbang.fyi" />
    <meta property="og:url" content="https://bitbang.fyi/" />
    <meta property="og:title" content="bitbang" />
    <meta property="og:description" content="In-depth, bit-level timing diagrams of communication protocols." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="bitbang" />
    <meta name="twitter:description" content="In-depth, bit-level timing diagrams of communication protocols." />
    <script>
      try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M3 21V4h6v17h6V4h6v17' fill='none' stroke='%236a3fd1' stroke-width='3' stroke-linejoin='miter'/%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <header class="top">
      <a class="logo" href="./" data-nav>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V4h6v17h6V4h6v17" /></svg>
        <span class="name">bitbang<span>.fyi</span></span>
      </a>
      <div class="top-right">
      <button class="theme" id="theme" type="button" aria-label="Switch to dark theme">
        <svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z"/></svg>
        <svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 0v2.5M8 13.5V16M0 8h2.5M13.5 8H16M2.3 2.3l1.8 1.8M11.9 11.9l1.8 1.8M2.3 13.7l1.8-1.8M11.9 4.1l1.8-1.8"/></svg>
      </button>
      <details class="menu" id="menu">
        <summary>Protocols</summary>
        <nav class="menu-panel" aria-label="Protocols"></nav>
      </details>
      </div>
    </header>

    <div id="content" tabindex="-1">
    <main id="viz">
      <section class="intro">
        <p class="crumbs" id="crumb-cat"></p>
        <h1 id="proto-name"></h1>
        <p class="fullname" id="proto-full"></p>
        <p id="proto-summary"></p>
        <p class="used"><b>Used in</b> <span id="proto-used"></span></p>
      </section>

      <section class="controls" id="controls" aria-label="Settings"></section>
      <p class="error" id="error" role="alert" hidden></p>

      <section class="instrument">
        <div class="toolbar">
          <div class="group">
            <button id="prev" aria-label="Previous bit" title="Previous bit (←)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 3L5 8l6 5z"/></svg></button>
            <button id="play" title="Play (space)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l8 5-8 5z"/></svg>Play</button>
            <button id="next" aria-label="Next bit" title="Next bit (→)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l6 5-6 5z"/></svg></button>
            <span id="step-label"></span>
          </div>
          <div class="group">
            <button id="tour-start" class="tour-start" hidden>Walk through</button>
            <button id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
            <button id="zoom-fit" title="Fit to width">Fit</button>
            <button id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
            <button id="copy-link" title="Copy a link to exactly this frame">Copy link</button>
          </div>
        </div>
        <div class="tour" id="tour-bar" hidden>
          <div class="tour-head">
            <button class="tour-prev"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 3L5 8l6 5z"/></svg>Back</button>
            <p class="tour-where"><span class="tour-count"></span> <b class="tour-title"></b></p>
            <button class="tour-next">Next<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l6 5-6 5z"/></svg></button>
            <button class="tour-exit" aria-label="Exit walkthrough" title="Exit (Esc)">✕</button>
          </div>
          <div class="strip" aria-hidden="true"></div>
        </div>
        <div class="scope" id="scope" tabindex="0" aria-label="Waveform. Use the arrow keys to step through bits."></div>
        <div class="explain" id="step-info" aria-live="polite"></div>
        <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
      </section>

      <section class="legend" id="legend" aria-label="Legend"></section>

      <section class="specs" aria-labelledby="specs-title">
        <div>
          <h2 id="specs-title">At a glance</h2>
          <dl class="glance" id="glance"></dl>
        </div>
        <div>
          <h2>Trade-offs</h2>
          <h3>Strengths</h3>
          <ul class="pros" id="strengths"></ul>
          <h3>Limits</h3>
          <ul class="cons" id="limits"></ul>
        </div>
      </section>

      <section class="deep" id="deep" aria-labelledby="deep-title" hidden>
        <h2 id="deep-title">Going deeper</h2>
        <div id="deep-body"></div>
      </section>
    </main>
    <main id="guide" hidden></main>
    </div>

    <footer>
      <span>bitbang.fyi</span>
      <span class="links">
        <a href="mailto:jiangmitchell@gmail.com?subject=bitbang%20feedback">Send feedback</a>
        <a href="https://github.com/mitchelljiang/bitbang">Source on GitHub</a>
      </span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
