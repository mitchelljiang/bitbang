<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bitbang</title>
    <meta name="description" content="Timing diagrams for UART, SPI and I²C, drawn from the bytes you type in. Click any bit to see what it does." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 12h3V4h4v8h4V4h3' fill='none' stroke='%23b69cf0' stroke-width='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="top">
      <a class="logo" href="./" data-nav>
        <svg viewBox="0 0 32 16" aria-hidden="true"><path d="M1 13h5V3h7v10h6V3h7v10h5" /></svg>
        bitbang<span>.fyi</span>
      </a>
      <details class="menu" id="menu">
        <summary>Protocols</summary>
        <nav class="menu-panel" aria-label="Protocols"></nav>
      </details>
    </header>

    <main id="home" hidden></main>

    <main id="viz" hidden>
      <section class="intro">
        <nav class="crumbs"><a href="./" data-nav>← All protocols</a><span id="crumb-cat"></span></nav>
        <h1 id="proto-name"></h1>
        <p id="proto-summary"></p>
      </section>

      <section class="controls panel" id="controls" aria-label="Settings"></section>
      <p class="error" id="error" role="alert" hidden></p>

      <section class="instrument panel">
        <div class="toolbar">
          <div class="group">
            <button id="prev" aria-label="Previous bit" title="Previous bit (←)">◀</button>
            <button id="play" title="Play (space)">▶ Play</button>
            <button id="next" aria-label="Next bit" title="Next bit (→)">▶</button>
            <span id="step-label"></span>
          </div>
          <div class="group">
            <button id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
            <button id="zoom-fit" title="Fit to width">Fit</button>
            <button id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
            <button id="copy-link" title="Copy a link to exactly this frame">Copy link</button>
          </div>
        </div>
        <div class="scope" id="scope" tabindex="0" aria-label="Waveform. Use the arrow keys to step through bits."></div>
        <div class="explain" id="step-info" aria-live="polite"></div>
        <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
      </section>

      <section class="legend" aria-label="Legend">
        <span><i class="tag k-start"></i>start</span>
        <span><i class="tag k-addr"></i>address</span>
        <span><i class="tag k-rw"></i>read/write</span>
        <span><i class="tag k-data"></i>data</span>
        <span><i class="tag k-parity"></i>parity</span>
        <span><i class="tag k-ack"></i>ACK</span>
        <span><i class="tag k-nack"></i>NACK</span>
        <span><i class="tag k-stop"></i>stop</span>
        <span><i class="tag dashed"></i>driven by target</span>
        <span><i class="dot"></i>sample point</span>
      </section>
    </main>

    <footer>
      bitbang.fyi · <a href="https://github.com/mitchelljiang/bitbang">source</a>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
